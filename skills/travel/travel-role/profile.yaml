# Профиль дома: то, что не меняется от поездки к поездке.
# Читает scripts/report.py. Числа здесь — статика «дома»; всё, что за границей, агент ищет
# на каждый запрос и кладёт строкой журнала. Поправка владельца — правка этого файла.

home:
  city: Warszawa
  currency: PLN                 # домашняя валюта: адаптеры просят её явно, report считает в ней
  airports:
    WAW:
      name: Chopin
      ground_pln: 4.40            # билет 75 мин, зона 1 (поезд S2/S3, автобусы 175/188 — lotnisko-chopina.pl)
      ground_note: "ZTM 75 мин 4,40 zł — цена по поиску 15.09.2026, wtp.waw.pl отдал 403; уточнить"
      ok: true
    WMI:
      name: Modlin
      ground_pln: 35              # ориентир: автобус до Модлина; живую цену даёт flixbus_fares.py
      ground_note: "ориентир 35 zł, живая цена — flixbus_fares.py (строка fare + fee)"
      live_ground: flixbus_api    # строка этого источника в варианте заменяет ориентир
      ok: ask                     # один из вопросов опроса: годится ли Модлин

travelers:
  adults: 1                       # по умолчанию; опрос уточняет

report:
  telegram_max_lines: 20
  drive_folder: "Поездки"
  ground_min_pln: 20              # дорога до аэропорта дешевле этого в сумму «до двери» не входит
